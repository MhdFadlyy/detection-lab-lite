name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff yamllint sigma-cli
      - run: ruff check harness/
      - run: yamllint -d relaxed detections/ attacks/
      - run: sigma check detections/execution detections/persistence detections/credential-access detections/discovery detections/lateral-movement detections/command-and-control || true
      - run: python3 harness/sigma_build.py --check   # portability signal; non-blocking on backend gaps

  replay:
    runs-on: ubuntu-latest        # 16 GB / 4 vCPU
    needs: lint
    # Full end-to-end: boot the stack, replay every attack, assert every alert.
    # Green as of Falco 0.44.1 (modern eBPF loads on the hosted-runner kernel).
    # If a hosted-runner quirk makes this flake, re-add `continue-on-error: true`
    # here rather than weakening the detections.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r harness/requirements.txt
      - name: Configure low-memory profile
        run: |
          sudo sysctl -w vm.max_map_count=262144
          cp .env.example .env   # already pins INDEXER_JAVA_OPTS to 1g
      - name: Bootstrap + start (CI profile — no honeypots/grafana)
        run: |
          ./lab bootstrap
          COMPOSE_PROFILES= ./lab up
      - name: Wait for Wazuh indexer
        run: |
          for i in $(seq 1 60); do
            curl -sk -u admin:SecretPassword https://localhost:9200 && break || sleep 10
          done
      - name: Replay all scenarios + verify
        run: ./lab test
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          set +e
          echo "::group::wazuh agents"
          docker compose -p detection-lab exec -T wazuh.manager /var/ossec/bin/agent_control -l
          echo "::endgroup::"
          echo "::group::target-linux agent"
          docker exec dll-target-linux /var/ossec/bin/wazuh-control status
          docker exec dll-target-linux sh -c 'tail -n 120 /var/ossec/logs/ossec.log'
          echo "::endgroup::"
          echo "::group::falco"
          docker logs --tail 120 dll-falco 2>&1
          docker exec dll-falco sh -c 'wc -l /tmp/falco_events.json 2>&1; tail -n 20 /tmp/falco_events.json 2>&1'
          echo "::endgroup::"
          echo "::group::indexer alert count"
          curl -sk -u admin:SecretPassword 'https://localhost:9200/wazuh-alerts-*/_count'
          echo
          curl -sk -u admin:SecretPassword 'https://localhost:9200/_cat/indices?v' | grep -i wazuh
          echo "::endgroup::"
      - name: Coverage report
        if: always()
        run: python3 harness/report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attack-coverage
          path: |
            docs/coverage.md
            docs/navigator-layer.json
