services:
  suricata:
    image: jasonish/suricata:7.0
    container_name: dll-suricata
    # Shares target-linux's own network namespace, so it sees exactly the
    # victim's traffic as "eth0" — deterministic on any host or CI runner.
    # (network_mode: host would put it on the real host NIC instead, which
    # never sees container-to-container traffic at all.)
    network_mode: "service:target-linux"
    depends_on: [target-linux]
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: >
      -i eth0
      -S /etc/suricata/rules/dll.rules
      --set outputs.1.eve-log.filename=/var/log/suricata/eve.json
    volumes:
      - suricata_logs:/var/log/suricata
      - ${DLL_ROOT}/compose/suricata/dll.rules:/etc/suricata/rules/dll.rules
      # (not :ro — the image's entrypoint chown -R's /etc/suricata on start)
    restart: unless-stopped

  falco:
    image: falcosecurity/falco:0.44.1
    container_name: dll-falco
    privileged: true            # runtime syscall visibility on the host kernel
    pid: host
    cap_add: [SYS_RESOURCE, BPF, PERFMON, SYS_PTRACE]
    ulimits:
      memlock: -1               # modern eBPF ring buffers need unbounded locked memory
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - falco_events:/var/log/falco
      - ${DLL_ROOT}/compose/falco/dll.yaml:/etc/falco/config.d/dll.yaml:ro
      - ${DLL_ROOT}/compose/falco/falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro
      - ${DLL_ROOT}/detections/falco:/etc/falco/rules.d:ro
    restart: unless-stopped

volumes:
  suricata_logs:
  falco_events:
