services:
  target-linux:
    build: ${DLL_ROOT}/compose/target-linux
    container_name: dll-target-linux
    hostname: target-linux
    # The victim. Attacks land here; the Wazuh agent ships FIM telemetry.
    # Process/syscall activity is observed by Falco from the host kernel.
    volumes:
      - ${DLL_ROOT}/attacks:/opt/attacks:ro
    environment:
      - WAZUH_MANAGER=wazuh.manager
    restart: unless-stopped
