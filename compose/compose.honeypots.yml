services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: dll-cowrie
    ports:
      - "2222:2222"   # SSH honeypot (map host 22 here if you want it front-line)
      - "2223:2223"   # Telnet honeypot
    volumes:
      - cowrie_logs:/cowrie/cowrie-git/var/log/cowrie
      - ${DLL_ROOT}/compose/cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ${DLL_ROOT}/compose/cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
    restart: unless-stopped

  opencanary:
    image: thinkst/opencanary:latest
    container_name: dll-opencanary
    ports:
      - "2121:21"     # FTP
      - "8080:80"     # HTTP
    volumes:
      # The image ships no config by default and refuses to start without
      # one — this is thinkst/opencanary's own test config, vendored
      # verbatim, whose default logger already writes JSON to
      # /var/tmp/opencanary.log.
      - ${DLL_ROOT}/compose/opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - opencanary_logs:/var/tmp
    restart: unless-stopped

volumes:
  cowrie_logs:
  opencanary_logs:
