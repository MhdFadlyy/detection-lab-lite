# detection-lab-lite Falco config override (auto-loaded from /etc/falco/config.d/).
# Modern eBPF works in a privileged container on kernel >= 5.8.
engine:
  kind: modern_ebpf

# Emit machine-readable events to a file on a shared volume. The harness reads it
# directly, and the target-linux Wazuh agent tails it so Falco alerts also land
# in the SIEM (one alert store).
json_output: true
json_include_output_property: true
json_include_tags_property: true

file_output:
  enabled: true
  keep_alive: true
  filename: /var/log/falco/events.json

stdout_output:
  enabled: true

# Lab: report everything from notice up.
priority: notice
