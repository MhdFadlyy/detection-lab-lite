# Overlay on top of wazuh-docker/single-node/docker-compose.yml.
# Only patches; the upstream file owns the base service definitions.
# Paths use ${DLL_ROOT} (exported by ./lab) so they resolve no matter which
# directory compose picks as the project directory.
services:
  wazuh.indexer:
    environment:
      - "OPENSEARCH_JAVA_OPTS=${INDEXER_JAVA_OPTS:--Xms1g -Xmx1g}"

  wazuh.manager:
    volumes:
      - ${DLL_ROOT}/compose/wazuh/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ${DLL_ROOT}/compose/wazuh/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml
      - ${DLL_ROOT}/compose/wazuh/local_decoder.xml:/wazuh-config-mount/etc/decoders/local_decoder.xml
      - ${DLL_ROOT}/detections/wazuh-native:/wazuh-config-mount/etc/rules/detection-lab-lite:ro
      - suricata_logs:/var/log/suricata:ro
      - cowrie_logs:/var/log/cowrie:ro

volumes:
  suricata_logs:
  cowrie_logs:
