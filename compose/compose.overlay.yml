# Overlay on top of wazuh-docker/single-node/docker-compose.yml.
# Minimal by design: the upstream manager config already enables authd + the
# ruleset dir etc/rules, so we only drop our custom rules in and tune the heap.
# ${DLL_ROOT} is exported by ./lab so paths resolve whatever the project dir is.
services:
  wazuh.indexer:
    environment:
      - "OPENSEARCH_JAVA_OPTS=${INDEXER_JAVA_OPTS:--Xms1g -Xmx1g}"

  wazuh.manager:
    volumes:
      # our hand-written rules — loaded automatically via the upstream
      # <rule_dir>etc/rules</rule_dir>. FIM (persistence) + Falco-sourced runtime.
      - ${DLL_ROOT}/detections/wazuh-native/0300-persistence.xml:/wazuh-config-mount/etc/rules/dll_persistence.xml:ro
      - ${DLL_ROOT}/detections/wazuh-native/0900-falco.xml:/wazuh-config-mount/etc/rules/dll_falco.xml:ro
