<!--
  detection-lab-lite victim agent config.
  Enrollment is done by entrypoint.sh (agent-auth). This file just points the
  agent at the manager and runs real-time FIM on the paths the persistence /
  credential-access scenarios touch. No auditd (not container-capable).
-->
<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <auto_restart>yes</auto_restart>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh.manager</manager_address>
      <agent_name>target-linux</agent_name>
    </enrollment>
  </client>

  <syscheck>
    <disabled>no</disabled>
    <scan_on_start>yes</scan_on_start>
    <frequency>300</frequency>
    <alert_new_files>yes</alert_new_files>

    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/systemd/system</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/cron.d</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/var/spool/cron</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/root/.ssh</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/home</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/crontab</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/passwd</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/shadow</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/sudoers</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/sudoers.d</directories>

    <nodiff>/etc/shadow</nodiff>
    <skip_nfs>yes</skip_nfs>
    <process_priority>10</process_priority>
  </syscheck>

  <!-- Falco (eBPF) alerts, shared in from the falco container via the falco_events
       volume, so runtime detections land in the SIEM alongside FIM. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/falco/events.json</location>
  </localfile>

  <!-- Cowrie (SSH/Telnet honeypot) JSON log, shared via the cowrie_logs volume. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/cowrie/cowrie.json</location>
  </localfile>

  <!-- Suricata EVE JSON (network IDS), shared via the suricata_logs volume. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- OpenCanary (FTP/HTTP/etc. honeypot) JSON log, shared via opencanary_logs. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/opencanary/opencanary.log</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
