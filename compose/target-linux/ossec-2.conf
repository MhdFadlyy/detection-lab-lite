<!--
  detection-lab-lite second victim (target-linux-2) agent config.
  Lean on purpose: this host only exists to prove cross-host correlation
  (lateral movement + a file landing on it gets caught by its own agent,
  independent of target-linux's telemetry). No Falco/Suricata/Cowrie/
  OpenCanary log tailing here, those are already covered by target-linux.
-->
<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <auto_restart>yes</auto_restart>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
  </client>

  <syscheck>
    <disabled>no</disabled>
    <scan_on_start>yes</scan_on_start>
    <frequency>300</frequency>
    <alert_new_files>yes</alert_new_files>

    <directories realtime="yes" report_changes="yes" check_all="yes">/home/pivot/incoming</directories>

    <skip_nfs>yes</skip_nfs>
    <process_priority>10</process_priority>
  </syscheck>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
