title: Shell history file truncated or deleted
id: 8f2a1c40-1b2e-4a7d-9d3c-0dll00000917
status: experimental
description: Detects removal or truncation of a shell history file (or `history -c`) — an attacker covering their tracks.
references:
  - https://attack.mitre.org/techniques/T1070/003/
author: detection-lab-lite
date: 2026-09-10
tags: [attack.defense_evasion, attack.t1070.003]
logsource:
  product: linux
  category: process_creation
detection:
  selection_file:
    Image|endswith: ['/rm', '/unlink', '/truncate', '/shred']
    CommandLine|contains: 'history'
  selection_builtin:
    Image|endswith: ['/bash', '/sh', '/zsh']
    CommandLine|contains: 'history -c'
  condition: selection_file or selection_builtin
falsepositives:
  - User housekeeping (rare on servers)
level: medium
dll:
  engine: falco
  falco_rule: DLL Shell History Tampering
  scenario: T1070.003_history_tampering
