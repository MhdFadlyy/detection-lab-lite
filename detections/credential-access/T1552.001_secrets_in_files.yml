title: Filesystem grep for secrets
id: 8f2a1c40-1b2e-4a7d-9d3c-0dll00000411
status: experimental
description: Detects recursive grep for password/token/secret patterns — searching the filesystem for unsecured credentials.
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: detection-lab-lite
date: 2026-09-06
tags: [attack.credential_access, attack.t1552.001]
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: ['/grep', '/egrep', '/rg']
    CommandLine|contains:
      - 'password'
      - 'passwd'
      - 'secret'
      - 'api_key'
      - 'token'
  condition: selection
falsepositives:
  - Developers searching their own code
level: medium
dll:
  wazuh_native: true
  wazuh_rule_id: "100411"
  scenario: T1552.001_secrets_in_files
