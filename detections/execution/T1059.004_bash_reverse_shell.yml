title: Bash reverse shell via /dev/tcp
id: 8f2a1c40-1b2e-4a7d-9d3c-0dll00000210
status: experimental
description: >
  Detects a bash process redirecting an interactive shell to a network socket
  using the /dev/tcp or /dev/udp pseudo-device — the classic one-liner reverse shell.
references:
  - https://gtfobins.github.io/gtfobins/bash/
author: detection-lab-lite
date: 2026-09-06
tags:
  - attack.execution
  - attack.t1059.004
  - attack.command_and_control
  - attack.t1071
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    a0|contains: '/dev/tcp/'
  selection_cmd:
    a0: 'bash'
    a0|contains: '-i'
  condition: selection or selection_cmd
falsepositives:
  - Legitimate health-check scripts that probe TCP ports via /dev/tcp (rare on servers)
level: high
# --- detection-lab-lite metadata ---
dll:
  wazuh_native: true           # firing rule is hand-written (detections/wazuh-native/); see README caveat
  wazuh_rule_id: "100210"
  scenario: T1059.004_bash_reverse_shell
