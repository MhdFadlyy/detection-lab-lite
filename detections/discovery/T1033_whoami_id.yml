title: Account/context discovery via whoami or id
id: 8f2a1c40-1b2e-4a7d-9d3c-0dll00000510
status: experimental
description: Detects execution of whoami or id — near-universal first commands after gaining a shell.
references:
  - https://attack.mitre.org/techniques/T1033/
author: detection-lab-lite
date: 2026-09-06
tags: [attack.discovery, attack.t1033]
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: ['/whoami', '/id']
  condition: selection
falsepositives:
  - Shell prompts, scripts checking privileges — noisy on its own; value is in correlation
level: low
dll:
  wazuh_native: true
  wazuh_rule_id: "100510"
  scenario: T1033_whoami_id
