title: Local account enumeration via passwd/group
id: 8f2a1c40-1b2e-4a7d-9d3c-0dll00000511
status: experimental
description: Detects reading /etc/passwd or /etc/group via cat/getent to enumerate local accounts.
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: detection-lab-lite
date: 2026-09-06
tags: [attack.discovery, attack.t1087.001]
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: ['/cat', '/getent']
    CommandLine|contains: ['/etc/passwd', '/etc/group', 'passwd']
  condition: selection
falsepositives:
  - Login shells, NSS tooling
level: low
dll:
  wazuh_native: true
  wazuh_rule_id: "100511"
  scenario: T1087.001_account_enum
