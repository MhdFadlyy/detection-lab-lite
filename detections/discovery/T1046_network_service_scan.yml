title: Network service scan with nc/nmap
id: 8f2a1c40-1b2e-4a7d-9d3c-0dll00000918
status: experimental
description: Detects nmap/masscan, or netcat run with the -z port-probe flag, from a workload — internal network service discovery.
references:
  - https://attack.mitre.org/techniques/T1046/
author: detection-lab-lite
date: 2026-09-10
tags: [attack.discovery, attack.t1046]
logsource:
  product: linux
  category: process_creation
detection:
  selection_tool:
    Image|endswith: ['/nmap', '/masscan', '/zmap']
  selection_nc:
    Image|endswith: ['/nc', '/ncat', '/netcat']
    CommandLine|contains: [' -z', ' -zv']
  condition: selection_tool or selection_nc
falsepositives:
  - Monitoring/health-check tooling probing ports
level: medium
dll:
  engine: falco
  falco_rule: DLL Network Service Scan
  scenario: T1046_network_service_scan
