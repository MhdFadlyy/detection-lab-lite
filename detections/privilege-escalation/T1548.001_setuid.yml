title: Setuid/setgid bit set via chmod
id: 8f2a1c40-1b2e-4a7d-9d3c-0dll00000916
status: experimental
description: Detects chmod adding the setuid/setgid bit to a file — a common privilege-escalation persistence trick.
references:
  - https://attack.mitre.org/techniques/T1548/001/
author: detection-lab-lite
date: 2026-09-10
tags: [attack.privilege_escalation, attack.t1548.001]
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/chmod'
    CommandLine|contains: ['+s', 'u+s', 'g+s', ' 4755', ' 6755', ' 2755']
  condition: selection
falsepositives:
  - Package post-install scripts setting setuid on legitimate binaries
level: high
dll:
  engine: falco
  falco_rule: DLL Setuid Bit Set
  scenario: T1548.001_setuid
